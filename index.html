<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>XPlainGames — новый адрес</title>
<link rel="canonical" href="https://aykhanov.github.io/xplaingames/">
<script>
  // Старый адрес aykhanov.github.io/xplaingame/… → новый aykhanov.github.io/xplaingames/…
  // Путь, параметры и всё после # (код комнаты, данные запуска из Телеграма) сохраняем.
  (function () {
    var path = location.pathname.replace(/^\/xplaingame(?=\/|$)/, '/xplaingames')
    if (path.indexOf('/xplaingames') !== 0) path = '/xplaingames/'
    location.replace(location.origin + path + location.search + location.hash)
  })()
</script>

  a { color: #d9620b; font-weight: 600; }
